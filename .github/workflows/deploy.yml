name: Deploy Backend & Website

on:
  push:
    branches:
      - backend-development
      - main
    paths:
      - 'backend/**'
      - 'LineLess Web/**'
  workflow_dispatch:

jobs:
  # કયા ફોલ્ડરમાં ફેરફાર થયો છે તે ચકાસશે
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Folder Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            website:
              - 'LineLess Web/**'

  # બેકએન્ડ ડિપ્લોયમેન્ટ જોબ
  deploy-backend:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Backend to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/src/**,backend/package.json,backend/package-lock.json,backend/ecosystem.config.js"
          target: "/var/www/lineless-node"
          strip_components: 1

      - name: Restart Backend via PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/lineless-node
            npm install --production
            pm2 reload lineless-backend --update-env

  # વેબસાઇટ બિલ્ડ અને ડિપ્લોયમેન્ટ જોબ
  deploy-website:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Website
        run: |
          cd "LineLess Web"
          npm install
          npm run build

      - name: Copy Dist to Server Website Folder
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "LineLess Web/dist/**"
          target: "/var/www/lineless-node/website"
          strip_components: 2

      - name: Reload PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            pm2 reload lineless-backend