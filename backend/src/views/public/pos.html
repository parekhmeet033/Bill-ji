<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS · BillJi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --brand:#FE701A; --brand-dark:#E55806; --ink:#1f2a52; }
    * { font-family:'Nunito',system-ui,sans-serif; }
    body { margin:0; background:#f1f3fa; color:#3a4568; padding-bottom:84px; }
    .topbar { background:#fff; border-bottom:1px solid #e9edf6; padding:14px 16px; position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; }
    .topbar .nm { font-weight:800; color:var(--ink); font-size:1.1rem; line-height:1.1; }
    .topbar .cd { font-size:.75rem; color:#8a92a8; font-weight:700; }
    .cat-nav { position:sticky; top:58px; z-index:19; background:#f1f3fa; padding:12px 12px 8px; display:flex; gap:8px; overflow-x:auto; }
    .cat-nav button { flex:none; border:1px solid #e4e8f2; background:#fff; color:#5a647e; border-radius:20px; padding:7px 15px; font-weight:700; font-size:.85rem; white-space:nowrap; }
    .cat-nav button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:6px 12px; }
    @media (min-width:640px){ .grid { grid-template-columns:repeat(3,1fr); } }
    @media (min-width:960px){ .grid { grid-template-columns:repeat(4,1fr); } }
    .card2 { background:#fff; border-radius:14px; padding:12px; box-shadow:0 3px 14px rgba(31,42,82,.05); display:flex; flex-direction:column; }
    .card2 img, .card2 .ph { width:100%; height:92px; border-radius:10px; object-fit:cover; background:#eef1f8; }
    .card2 .ph { display:grid; place-items:center; color:#b9c1d4; font-size:30px; }
    .card2 .nm { font-weight:700; color:var(--ink); font-size:.92rem; margin:8px 0 2px; }
    .card2 .pr { font-weight:800; color:var(--brand); }
    .addbtns { display:flex; gap:6px; margin-top:8px; }
    .addbtns button { flex:1; border:none; border-radius:8px; padding:7px; font-weight:700; font-size:.8rem; background:var(--brand); color:#fff; }
    .addbtns button.half { background:#eef1fb; color:var(--brand); }
    .cat-title { font-weight:800; color:var(--ink); font-size:1.05rem; margin:16px 12px 2px; }

    .cartbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--brand); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; box-shadow:0 -6px 20px rgba(67,97,238,.25); }
    .cartbar.hidden { display:none; }
    .cartbar .c { font-weight:800; }

    .cart-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f0f2f8; }
    .cart-item .nm { flex:1; font-weight:700; color:var(--ink); font-size:.92rem; }
    .qty { display:flex; align-items:center; gap:8px; }
    .qty button { width:30px; height:30px; border:none; border-radius:8px; background:#eef1fb; color:var(--brand); font-weight:800; }
    .btn-brand { background:var(--brand); border:none; color:#fff; font-weight:700; } .btn-brand:hover{ background:var(--brand-dark); color:#fff; }
    .toast-ok { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:60; background:#1aa053; color:#fff; padding:12px 22px; border-radius:12px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.2); display:none; }
  </style>
</head>
<body>
  <div class="topbar">
    <div><div class="nm" id="shopName">Loading…</div><div class="cd" id="shopCode"></div></div>
    <span class="badge rounded-pill text-bg-light" id="modeBadge"></span>
  </div>
  <div class="cat-nav" id="catNav"></div>
  <div id="grid"><div class="text-center text-muted py-5">Loading products…</div></div>

  <div class="cartbar hidden" id="cartBar" onclick="openCart()">
    <span class="c"><i class="bi bi-cart3 me-1"></i><span id="cartCount">0</span> items</span>
    <span class="c">₹<span id="cartTotal">0</span> · View cart <i class="bi bi-chevron-up"></i></span>
  </div>

  <!-- Cart Modal -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border:none;border-radius:16px;">
        <div class="modal-header"><h5 class="modal-title fw-bold">Your Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="cartItems"></div>
          <div class="row g-2 mt-2">
            <div class="col-6"><input class="form-control" id="cName" placeholder="Customer name"></div>
            <div class="col-6"><input class="form-control" id="cMobile" placeholder="Mobile"></div>
            <div class="col-12"><input class="form-control" id="cNote" placeholder="Note (optional)"></div>
            <div class="col-6">
              <select class="form-select" id="cPay"><option value="cash">Cash</option><option value="upi">UPI</option></select>
            </div>
            <div class="col-6">
              <select class="form-select" id="cType"><option value="takeaway">Takeaway</option><option value="dine_in">Dine-in</option></select>
            </div>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <div class="fw-bold fs-5" style="color:var(--ink)">Total: ₹<span id="modalTotal">0</span></div>
          <button class="btn btn-brand px-4" id="placeBtn">Place Order</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-ok" id="toastOk"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const parts = location.pathname.split('/').filter(Boolean); // [code, 'pos-order', slug]
    const slug = decodeURIComponent(parts[parts.length - 1] || '');
    const code = decodeURIComponent(parts[0] || '');
    const IMG = '/storage/products/';
    const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => Number(n||0).toFixed(0);
    const cartModal = new bootstrap.Modal(document.getElementById('cartModal'));

    let cart = []; // {key, product_id, product_name, unit, price, qty}

    async function load(){
      let res;
      try { res = await (await fetch('/public-api/shop/'+encodeURIComponent(slug))).json(); }
      catch(e){ document.getElementById('grid').innerHTML='<div class="text-center text-muted py-5">Could not load.</div>'; return; }
      if(!res || !res.success){ document.getElementById('shopName').textContent='Shop not found'; document.getElementById('grid').innerHTML='<div class="text-center text-muted py-5">Invalid POS link.</div>'; return; }

      const { shop, categories } = res.data;
      document.getElementById('shopName').textContent = shop.name;
      document.getElementById('shopCode').textContent = 'POS · ' + (code || shop.generated_code || '');
      document.getElementById('modeBadge').textContent = (shop.mode || 'both');

      const withItems = categories.filter(c => c.products && c.products.length);
      document.getElementById('catNav').innerHTML = withItems.map((c,i)=>`<button class="${i===0?'active':''}" id="nav${i}" onclick="jump(${i})">${esc(c.name)}</button>`).join('');

      const grid = document.getElementById('grid');
      if(!withItems.length){ grid.innerHTML='<div class="text-center text-muted py-5">No products available.</div>'; return; }
      grid.innerHTML = withItems.map((c,i)=>`
        <div class="cat-title" id="cat${i}">${esc(c.name)}</div>
        <div class="grid">
          ${c.products.map(p=>{
            const pj = esc(JSON.stringify(p));
            return `<div class="card2">
              ${p.image ? `<img src="${IMG}${esc(p.image)}" onerror="this.outerHTML='<div class=\\'ph\\'><i class=\\'bi bi-egg-fried\\'></i></div>'">` : `<div class="ph"><i class="bi bi-egg-fried"></i></div>`}
              <div class="nm">${esc(p.name)}</div>
              <div class="pr">₹${money(p.price)}</div>
              <div class="addbtns">
                <button onclick='add(${pj}, false)'>Add</button>
                ${p.half_price ? `<button class="half" onclick='add(${pj}, true)'>½ ₹${money(p.half_price)}</button>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>`).join('');
    }

    window.jump = i => {
      document.querySelectorAll('.cat-nav button').forEach(b=>b.classList.remove('active'));
      document.getElementById('nav'+i).classList.add('active');
      document.getElementById('cat'+i).scrollIntoView({ behavior:'smooth', block:'start' });
    };

    window.add = (p, half) => {
      const price = half ? Number(p.half_price) : Number(p.price);
      const unit = half ? 'HALF' : (p.unit || 'PLATE');
      const key = p.id + '-' + unit;
      const found = cart.find(x => x.key === key);
      if(found) found.qty++;
      else cart.push({ key, product_id:p.id, product_name:p.name + (half?' (Half)':''), unit, price, qty:1 });
      renderCart();
    };

    function totals(){ return cart.reduce((a,i)=>({ q:a.q+i.qty, t:a.t+i.qty*i.price }), {q:0,t:0}); }

    function renderCart(){
      const { q, t } = totals();
      document.getElementById('cartCount').textContent = q;
      document.getElementById('cartTotal').textContent = money(t);
      document.getElementById('modalTotal').textContent = money(t);
      document.getElementById('cartBar').classList.toggle('hidden', q===0);
      const box = document.getElementById('cartItems');
      box.innerHTML = cart.length ? cart.map((i,idx)=>`
        <div class="cart-item">
          <div class="nm">${esc(i.product_name)}<div class="text-muted" style="font-size:.8rem;font-weight:600">₹${money(i.price)}</div></div>
          <div class="qty">
            <button onclick="dec(${idx})">−</button><span class="fw-bold">${i.qty}</span><button onclick="inc(${idx})">+</button>
          </div>
          <div class="fw-bold" style="min-width:52px;text-align:right">₹${money(i.qty*i.price)}</div>
        </div>`).join('') : '<div class="text-center text-muted py-4">Cart is empty</div>';
    }
    window.inc = i => { cart[i].qty++; renderCart(); };
    window.dec = i => { cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); renderCart(); if(!cart.length) cartModal.hide(); };
    window.openCart = () => { renderCart(); cartModal.show(); };

    document.getElementById('placeBtn').addEventListener('click', async ()=>{
      if(!cart.length) return;
      const btn = document.getElementById('placeBtn'); btn.disabled=true; btn.textContent='Placing…';
      const payload = {
        customer_name: document.getElementById('cName').value.trim() || 'Walk-in Customer',
        customer_mobile: document.getElementById('cMobile').value.trim() || 'N/A',
        special_note: document.getElementById('cNote').value.trim(),
        payment_type: document.getElementById('cPay').value,
        order_type: document.getElementById('cType').value,
        items: cart.map(i=>({ product_id:i.product_id, product_name:i.product_name, unit:i.unit, qty:i.qty, price:i.price, total:i.qty*i.price }))
      };
      let res;
      try { res = await (await fetch('/public-api/pos/'+encodeURIComponent(slug)+'/order', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })).json(); }
      catch(e){ res = { success:false, message:'Network error' }; }
      btn.disabled=false; btn.textContent='Place Order';
      if(res && res.success){
        cart = []; renderCart(); cartModal.hide();
        const t = document.getElementById('toastOk');
        t.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Order placed · Token #' + (res.data?res.data.tokenNo:'');
        t.style.display='block'; setTimeout(()=>t.style.display='none', 3000);
        document.getElementById('cName').value=''; document.getElementById('cMobile').value=''; document.getElementById('cNote').value='';
      } else alert((res && res.message) || 'Could not place order.');
    });

    load();
  </script>
</body>
</html>
