<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · BillJi Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --brand: #FE701A; --brand-dark: #E55806; }
    * { font-family: 'Nunito', system-ui, sans-serif; }
    body {
      min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f0f2f8 0%, #e6eaf5 100%); padding: 16px;
    }
    .login-card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(67, 94, 190, .12); padding: 40px 32px;
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
    .brand-img { width: 100%; max-width: 170px; height: auto; display: block; }
    .brand-logo {
      width: 44px; height: 44px; border-radius: 12px; background: var(--brand);
      color: #fff; display: grid; place-items: center; font-size: 22px;
    }
    .brand-name { font-weight: 800; font-size: 1.35rem; color: #25396f; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #25396f; margin-bottom: 4px; }
    .subtitle { color: #8a94a6; font-size: .95rem; margin-bottom: 24px; }
    .form-label { font-weight: 600; color: #4b5675; font-size: .9rem; }
    .form-control { padding: 12px 14px; border-radius: 10px; border: 1px solid #dde2ee; }
    .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(67,94,190,.12); }
    .btn-brand {
      background: var(--brand); border: none; color: #fff; font-weight: 700;
      padding: 12px; border-radius: 10px; width: 100%; font-size: 1rem;
    }
    .btn-brand:hover { background: var(--brand-dark); color: #fff; }
    .input-group-text { background: #f6f7fb; border: 1px solid #dde2ee; border-right: none; border-radius: 10px 0 0 10px; color: #8a94a6; }
    .input-group .form-control { border-left: none; border-radius: 0 10px 10px 0; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <img src="/assets/billji_wordmark.jpg" alt="BillJi" class="brand-img">
    </div>
    <h1>Log in.</h1>
    <p class="subtitle">Log in with your admin account to manage users.</p>

    <div id="errorBox" class="alert alert-danger py-2" style="display:none"></div>

    <form method="POST" action="/admin/login" autocomplete="on">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary input-group-text" type="button" id="togglePassword" style="border-left:none;border-radius:0 10px 10px 0;cursor:pointer;" aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>
      <button class="btn-brand" type="submit">Log in</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) {
      const box = document.getElementById('errorBox');
      box.textContent = err;
      box.style.display = 'block';
    }

    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('togglePasswordIcon');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }
  </script>
</body>
</html>
